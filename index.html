<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f5ec"><meta name="referrer" content="no-referrer"><title>我们的飞鼠图鉴</title><meta name="description" content="两个人的飞鼠收藏清单，记录已买、未买与新来的小鼠。"><link rel="stylesheet" href="style.css"></head>
<body><main class="album"><header><div class="eyebrow"><span>♡</span> 两个人的小小收藏</div><h1>飞鼠图鉴<span> COLLECTION</span></h1><p class="intro">一只一只，慢慢收集。</p><div class="summary"><div><strong id="boughtCount">25</strong><span>已买</span></div><i></i><div><strong id="leftCount">67</strong><span>未买</span></div><i></i><div><strong id="allCount">92</strong><span>图鉴总数</span></div></div><div class="progress"><span id="progress"></span></div><div class="connection"><span id="syncState" role="status">正在连接共享清单…</span><button id="retry" hidden>重试保存</button></div></header>
<section class="tools" aria-label="筛选图鉴"><div class="filters"><button data-filter="all" class="active">全部</button><button data-filter="bought">已买</button><button data-filter="left">未买</button><button data-filter="box">收纳盒</button></div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="找一只小鼠…" aria-label="搜索飞鼠名称"></label></section>
<p class="hint">轻点状态标记 · 点图片查看 / 编辑</p><div id="catalog"></div><p id="empty" hidden>没有找到这只小鼠，试试别的名字吧。</p><footer>原图：小米笔记 · 手绘斜线已标为“已买”<br>部分名称按造型暂命名，可点图片修改。<br><button id="backup">导出备份</button><span> · </span><button id="restore">导入备份</button><input type="file" id="restoreFile" accept="application/json" hidden></footer></main>
<nav class="bottom" aria-label="图鉴操作"><button id="toTop"><span>▦</span> 图鉴</button><button id="add" class="add"><span>＋</span> 录入新鼠</button><button id="share"><span>♡</span> 分享给 TA</button></nav>
<dialog id="editor"><form id="editForm"><div class="sheet-title"><h2 id="dialogTitle">录入新鼠</h2><button type="button" id="close" aria-label="关闭">×</button></div><div class="preview" id="photoPreview"><span>🐭</span></div><label class="upload">＋ 选择 / 拍摄照片<input type="file" id="photoFile" accept="image/*"></label><label>小鼠名字<input id="name" required maxlength="80" placeholder="给这只小鼠起个名字"></label><label>放在哪一组<input id="group" required maxlength="40" list="groupOptions" value="新来的小鼠"><datalist id="groupOptions"></datalist></label><label>收藏小记<textarea id="note" maxlength="500" rows="2" placeholder="在哪里买的、特别的纪念…"></textarea></label><label class="checkbox"><input id="isBought" type="checkbox"> 这只已经买啦</label><div class="form-actions"><button type="button" id="hideItem" hidden>移入收纳盒</button><button id="save" type="submit" class="primary">保存到我们的图鉴</button></div><p id="formError" role="alert"></p></form></dialog>
<dialog id="shareDialog"><div class="sheet-title"><h2>一起收集吧 ♡</h2><button id="closeShare" aria-label="关闭">×</button></div><p>把这个链接发给 TA。你们打开同一个链接，购买标记、新鼠照片和备注就会同步。</p><textarea id="shareLink" readonly aria-label="共享链接" rows="3"></textarea><button id="copyLink" class="primary">复制共享链接</button><p class="fine">持有链接的人可以查看和修改。请仅分享给你们两个人；每隔 8 秒自动同步，离线修改会在联网后重试。</p></dialog>
<div class="toast" id="toast" role="status"></div><script src="seed.js"></script><script src="app.js?v=20261012-3"></script></body></html>
