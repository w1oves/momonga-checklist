<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f5ec"><meta name="referrer" content="no-referrer"><title>飞鼠图鉴 · 鼠窝点名册</title><meta name="description" content="飞鼠点名册：已买划掉，未买继续蹲。支持新鼠登记和共享同步。"><link rel="stylesheet" href="style.css?v=20261012-4"></head>
<body><main class="album"><header><div class="eyebrow">鼠窝点名册</div><h1>飞鼠图鉴<span> MOMONGA</span></h1><p class="intro">已买划掉，未买继续蹲。</p><div class="summary"><div><strong id="boughtCount">25</strong><span>已买</span></div><i></i><div><strong id="leftCount">67</strong><span>未买</span></div><i></i><div><strong id="allCount">92</strong><span>图鉴总数</span></div></div><div class="progress"><span id="progress"></span></div><div class="connection"><span id="syncState" role="status">正在连上鼠窝…</span><button id="retry" hidden>重试保存</button></div></header>
<section class="tools" aria-label="筛选图鉴"><div class="filters"><button data-filter="all" class="active">全部</button><button data-filter="bought">已买</button><button data-filter="left">未买</button><button data-filter="box">收纳盒</button></div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="这次找哪只鼠？" aria-label="搜索飞鼠名称"></label></section>
<p class="hint">未买可点击标记 · 已买会划掉并锁定</p><div id="catalog"></div><p id="empty" hidden>这只鼠没点到名，换个名字找找。</p><footer>原图：小米笔记 · 手绘斜线已标为“已买”<br>部分名称按造型暂命名，可点图片修改。<br><button id="backup">导出备份</button><span> · </span><button id="restore">导入备份</button><input type="file" id="restoreFile" accept="application/json" hidden></footer></main>
<nav class="bottom" aria-label="图鉴操作"><button id="toTop"><span>▦</span> 图鉴</button><button id="add" class="add"><span>＋</span> 新鼠报到</button><button id="share"><span>↗</span> 共享鼠窝</button></nav>
<dialog id="editor"><form id="editForm"><div class="sheet-title"><h2 id="dialogTitle">新鼠报到</h2><button type="button" id="close" aria-label="关闭">×</button></div><div class="preview" id="photoPreview"><span>🐭</span></div><label class="upload">＋ 选择 / 拍摄照片<input type="file" id="photoFile" accept="image/*"></label><label>小鼠名字<input id="name" required maxlength="80" placeholder="这只鼠叫啥？"></label><label>放在哪一组<input id="group" required maxlength="40" list="groupOptions" value="新鼠报到处"><datalist id="groupOptions"></datalist></label><label>鼠鼠档案<textarea id="note" maxlength="500" rows="2" placeholder="在哪蹲到的？花了多少？"></textarea></label><label class="checkbox"><input id="isBought" type="checkbox"> 已买，准许进窝</label><p id="purchaseHint" class="fine"></p><div class="form-actions"><button type="button" id="hideItem" hidden>移入收纳盒</button><button id="save" type="submit" class="primary">登记入册</button></div><p id="formError" role="alert"></p></form></dialog>
<dialog id="shareDialog"><div class="sheet-title"><h2>共享鼠窝</h2><button id="closeShare" aria-label="关闭">×</button></div><p>把链接发给另一位窝主。打开同一个链接，买了哪只、新来了谁，两边都能看到。</p><textarea id="shareLink" readonly aria-label="共享链接" rows="3"></textarea><button id="copyLink" class="primary">复制鼠窝链接</button><p class="fine">持有链接的人可以查看和修改。请仅分享给你们两个人；每隔 8 秒自动同步，离线修改会在联网后重试。</p></dialog>
<div class="toast" id="toast" role="status"></div><script src="seed.js"></script><script src="app.js?v=20261012-4"></script></body></html>
